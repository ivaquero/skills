[tool.ruff]
fix = true
fix-only = true
target-version = "py314"
line-length = 88

[tool.ruff.format]
docstring-code-format = true

docstring-code-line-length = 60
line-ending = "lf"
skip-magic-trailing-comma = false
exclude = ["*.md"]

[tool.ruff.lint]
extend-select = [
  "DTZ",
  "E",
  "F",
  "I",
  "ISC",
  "NPY",
  "PERF",
  "RUF",
  "S",
  "SIM",
  "TID",
  "UP",
  "W",
]
fixable = ["ALL"]
ignore = [
  "RUF001",
  "RUF002",
  "RUF003",
  "S101",
  "S310",
  "S603",
]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true
