<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 210" width="330" height="210">
  <style type="text/css">
    .st0{fill:#ffffff;stroke:#cccccc;stroke-width:1}
    .st1{fill:#dae8fc;stroke:#6c8ebf;stroke-width:1.5}
    .st2{font-family:Arial;font-size:12px;fill:#123456}
    .st3{font-family:Arial;font-size:10px;fill:#7a7a7a}
    .st4{fill:#333333;stroke:none}
  </style>
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#dae8fc" />
    </linearGradient>
  </defs>
  <g id="page1" transform="translate(5,5)">
    <rect x="1" y="1" width="323" height="203" class="st0" />
    <g transform="translate(40,28)">
      <rect x="0" y="0" width="120" height="44" rx="6" class="st1" />
      <text class="st2" x="14" y="27">Root node</text>
    </g>
    <g transform="translate(40,116)">
      <rect x="0" y="0" width="120" height="44" rx="6" fill="url(#grad1)" stroke="#6c8ebf" stroke-width="1.5" />
      <text x="14" y="20">
        <tspan class="st2" x="14" y="20">Branch one</tspan>
        <tspan class="st3" x="14" y="35">second line</tspan>
      </text>
    </g>
    <path d="M97,74 L103,74 L103,96 L110,96 L100,110 L90,96 L97,96 Z" class="st4" />
    <g transform="rotate(-18 250 120)">
      <rect x="196" y="98" width="96" height="34" fill="#fff2cc" stroke="#d6b656" stroke-width="1" />
      <text class="st2" x="206" y="120">Rotated</text>
    </g>
  </g>
</svg>
